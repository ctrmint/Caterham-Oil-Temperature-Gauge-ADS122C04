<text x='1290' y='690' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='11' text-anchor='middle' font-weight='normal' fill='#555'>chassis</text>
<text x='40' y='740' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='13' text-anchor='start' font-weight='bold' fill='#222'>Each 250 ms, six conversions (45 SPS, gain 1, PGA bypassed): offset (inputs shorted) · Vref = A0 − A1 · Vs = A1 − A2 ·</text>
<text x='40' y='764' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='13' text-anchor='start' font-weight='normal' fill='#222'>A2 to ground and A1 to ground, each with the 10 µA burn-out source on · AVDD through the chip's monitor.</text>
<text x='40' y='788' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='13' text-anchor='start' font-weight='bold' fill='#222'>Rs = Rref × Vs / Vref: the same current flows through both, so its ±6 % accuracy, the ADC reference and the rail all cancel.</text>
<text x='40' y='812' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='13' text-anchor='start' font-weight='normal' fill='#222'>Faults: Vref ≈ 0 → SENSOR OPEN · Vs ≈ 0 → SENSOR SHORT · A2 pulled up (sense wire or R2 open) → GROUND FAULT ·</text>
<text x='40' y='836' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='13' text-anchor='start' font-weight='normal' fill='#222'>A1 pulled up (R1 open) → SENSOR OPEN · Vref / Rref outside 210–290 µA, or AVDD outside 2.9–3.5 V → SUPPLY FAULT.</text>
<text x='40' y='860' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='13' text-anchor='start' font-weight='normal' fill='#222'>No clamps or TVS: at least 2 kΩ between every harness wire and the ADC holds a short to 14.4 V to about 5 mA per pin</text>
<text x='40' y='884' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='13' text-anchor='start' font-weight='normal' fill='#222'>(rated 10 mA). This is not load-dump or surge qualification; bench and in-car fault tests are owed (WIRING.md).</text>
</svg>
