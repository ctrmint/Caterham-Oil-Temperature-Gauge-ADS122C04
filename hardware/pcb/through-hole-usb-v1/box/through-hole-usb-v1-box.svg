<text x="132.0" y="576.0" font-size="13" font-weight="bold">Mounting holes (M3 clearance, 3.2 mm; keep bosses inside the dashed circles):</text>
<text x="132.0" y="595.0" font-size="13">H1 at x 4.5, y 57.5; boss up to 7.2 mm across</text>
<text x="132.0" y="614.0" font-size="13">H2 at x 60.5, y 57.5; boss up to 7.2 mm across</text>
<text x="132.0" y="633.0" font-size="13">H3 at x 4.5, y 4.5; boss up to 7.2 mm across</text>
<text x="132.0" y="652.0" font-size="13">H4 at x 60.5, y 4.5; boss up to 7.2 mm across</text>
<text x="132.0" y="671.0" font-size="13" font-weight="bold">Cable wall (bottom edge): an opening for each plug, x from the board's left edge:</text>
<text x="132.0" y="690.0" font-size="13">J3 display cable, Micro-Fit 2x3 plug: x 9.5 to 23.7 (14.2 wide), about 8 mm (header body 7.4 mm) above the board top</text>
<text x="132.0" y="709.0" font-size="13">J2 sender harness, Micro-Fit 1x4 plug: x 39.6 to 56.4 (16.8 wide), about 5 mm (header body 4.4 mm) above the board top</text>
<text x="132.0" y="728.0" font-size="13">Allow 1 mm round each opening and room above it for the plug's latch to be pressed.</text>
<text x="132.0" y="747.0" font-size="13" font-weight="bold">Heights:</text>
<text x="132.0" y="766.0" font-size="13">J3, the 2x3 header, is the tallest part (body 7.4 mm). The ADS1115 module on its 2.54 mm header stands about 5 mm,</text>
<text x="132.0" y="785.0" font-size="13">and the test loops 4.6 mm (Keystone drawing). Check the C0G capacitors (TDK FG26) on their datasheet; allow 15 mm above the board.</text>
<text x="132.0" y="804.0" font-size="13">Leave at least 5 mm under the board for the solder side and the M3 screw heads or nuts.</text>
</svg>
