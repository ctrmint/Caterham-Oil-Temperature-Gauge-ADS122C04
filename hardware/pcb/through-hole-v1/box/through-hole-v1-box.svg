<text x="132.0" y="588.0" font-size="13" font-weight="bold">Mounting holes (M3 clearance, 3.2 mm; keep bosses inside the dashed circles):</text>
<text x="132.0" y="607.0" font-size="13">H1 at x 4.5, y 59.5; boss up to 7.2 mm across</text>
<text x="132.0" y="626.0" font-size="13">H2 at x 87.5, y 59.5; boss up to 7.2 mm across</text>
<text x="132.0" y="645.0" font-size="13">H3 at x 4.5, y 4.5; boss up to 7.2 mm across</text>
<text x="132.0" y="664.0" font-size="13">H4 at x 87.5, y 4.5; boss up to 7.2 mm across</text>
<text x="132.0" y="683.0" font-size="13" font-weight="bold">Cable wall (bottom edge): an opening for each plug, x from the board's left edge:</text>
<text x="132.0" y="702.0" font-size="13">J1 power, Micro-Fit 1x3 plug: x 10.1 to 23.9 (13.8 wide), about 5 mm (header body 4.4 mm) above the board top</text>
<text x="132.0" y="721.0" font-size="13">J3 display cable, Micro-Fit 2x4 plug: x 32.4 to 49.6 (17.2 wide), about 8 mm (header body 7.4 mm) above the board top</text>
<text x="132.0" y="740.0" font-size="13">J2 sender harness, Micro-Fit 1x3 plug: x 65.6 to 79.4 (13.8 wide), about 5 mm (header body 4.4 mm) above the board top</text>
<text x="132.0" y="759.0" font-size="13">Allow 1 mm round each opening and room above it for the plug's latch to be pressed.</text>
<text x="132.0" y="778.0" font-size="13" font-weight="bold">Heights:</text>
<text x="132.0" y="797.0" font-size="13">C5, the 10 x 16 mm electrolytic, stands about 17 mm: allow at least 20 mm above the board.</text>
<text x="132.0" y="816.0" font-size="13">U2 (Traco TSR 1-2450) and the ADS1115 module on its 2.54 mm header are lower; check the TSR 1 datasheet for its height.</text>
<text x="132.0" y="835.0" font-size="13">Leave at least 5 mm under the board for the solder side and the M3 screw heads or nuts.</text>
</svg>
